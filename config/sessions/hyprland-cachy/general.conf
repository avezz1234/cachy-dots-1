general {
    border_size             = 0
    gaps_in                 = 4
    gaps_out                = 4
    resize_on_border        = true
    extend_border_grab_area = 30
    layout                  = dwindle
}

decoration {
    rounding         = 4
    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    font_family              = JetBrains Mono
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    focus_on_activate        = true
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}
