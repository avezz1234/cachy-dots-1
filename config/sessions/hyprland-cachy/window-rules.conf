# ── Layer rules ───────────────────────────────────────────────
layerrule {
    name    = no-anim-osd
    no_anim = on
    match:namespace = ^(volume_osd|brightness_osd|hyprpicker|qsdock)$
}

layerrule {
    name  = blur-lockscreen
    blur  = on
    match:namespace = ^(ext-session-lock)$
}

layerrule {
    name          = ignorealpha-lockscreen
    ignore_alpha  = 0.2
    match:namespace = ^(ext-session-lock)$
}

# ── Window rules ──────────────────────────────────────────────
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move  = 20 monitor_h-120
    float = yes
}

windowrule {
    name = cs2-immediate
    match:class = ^(cs2)$
    immediate        = yes
    keep_aspect_ratio = yes
}

windowrule {
    name = app-launcher
    match:title = ^(app-launcher)$
    float  = yes
    center = yes
    size   = 1200 600
}

windowrule {
    name = qs-master
    match:title = ^(qs-master)$
    float            = yes
    pin              = yes
    no_shadow        = yes
    no_initial_focus = yes
    move             = -5000 -5000
}
